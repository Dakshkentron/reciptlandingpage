<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/receipt-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt — Internal Console</title>

    <!-- An internal tool has nothing to gain from being found. No description,
         no social card, no canonical: nothing here should be indexable or
         shareable as a link preview. -->

    <meta name="referrer" content="same-origin" />

    <!-- Matches the marketing site so the two read as one product. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>The Receipt internal console needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
